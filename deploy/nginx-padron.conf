# /etc/nginx/sites-available/padron  (luego: ln -s a sites-enabled y nginx -s reload)
# Cambia padron.tudominio.com por tu dominio. Para HTTPS gratis: certbot --nginx -d padron.tudominio.com
server {
    listen 80;
    server_name padron.tudominio.com;

    client_max_body_size 5m;   # subida del logo

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
